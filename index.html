<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essensplan & Einkaufsliste</title>
    <!-- PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --body-bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg: #1e293b;
            --body-bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #cbd5e1;
            --border: #475569;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--body-bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px 16px 40px;
        }

        .app-container {
            width: 100%;
            max-width: 760px;
            display: grid;
            gap: 20px;
        }

        .app-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
        }

        .app-title h1 { margin: 0; font-size: 2.2rem; line-height: 1.1; }
        .subtitle { margin: 8px 0 0; color: var(--text-muted); font-size: 0.95rem; }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-message {
            min-height: 24px;
            font-size: 0.9rem;
            text-align: center;
        }
        .message-error { color: var(--danger); font-weight: 700; }
        .message-success { color: var(--success); font-weight: 700; }

        .day-card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .day-label { font-weight: 800; font-size: 1.1rem; color: var(--accent); }

        .cat-select {
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
        }

        .card-body {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .meal-img {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            object-fit: cover;
            background: var(--bg);
            border: 1px solid var(--border);
        }
        .meal-img.placeholder { border: none; opacity: 0.6; }

        .meal-info { flex-grow: 1; min-width: 0; }
        .meal-input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text);
            font-weight: 700;
            font-size: 1.1rem;
            outline: none;
            margin-bottom: 8px;
        }

        .btn-round {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: var(--accent);
            color: white;
            transition: transform 0.2s;
        }
        .btn-round:hover { transform: scale(1.05); }

        .recipe-btn {
            display: inline-block;
            cursor: pointer;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
        }

        .btn-action {
            padding: 14px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            background: var(--primary);
            color: white;
            transition: all 0.2s;
        }
        .btn-action:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-action.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-action.small { width: auto; padding: 10px 16px; font-size: 0.9rem; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            backdrop-filter: blur(5px);
            overflow-y: auto;
        }

        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        .modal-close { position: absolute; right: 20px; top: 20px; cursor: pointer; font-size: 1.5rem; }

        .tab-nav { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 15px; padding-bottom: 8px; }
        .tab-btn { padding: 8px 12px; border-radius: 8px; border: none; background: var(--bg); cursor: pointer; font-weight: 700; display: flex; align-items: center; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-btn svg { width: 20px; height: 14px; margin-right: 6px; border-radius: 2px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .sync-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 8px; background: var(--accent); color: white; font-weight: 800; }

        .shopping-list { list-style: none; padding: 0; }
        .shopping-list li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; cursor: pointer; }
        .shopping-list li.checked { opacity: 0.5; text-decoration: line-through; }
        .shop-day-header { font-weight: 800; color: var(--accent); margin-top: 20px; border-bottom: 2px solid var(--border); }

        @media (max-width: 600px) {
            .card-body { flex-direction: column; text-align: center; }
            .meal-img { width: 100%; height: 150px; }
            .recipe-btn { margin: 0 auto; }
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <script type="importmap">
      { "imports": { "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js", "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js" } }
    </script>
</head>
<body>

<div class="app-container">
    <div class="app-top">
        <div class="app-title">
            <h1>Essensplan</h1>
            <p class="subtitle">Plane deine Woche und teile sie mit anderen.</p>
            <div id="syncStatus" class="sync-badge" style="display:none; width:fit-content; margin-top:8px;">☁️ Cloud Synchronisation aktiv</div>
        </div>
        <div class="header-actions">
            <button onclick="window.toggleTheme()" id="themeBtn" class="btn-action small">🌙</button>
            <select id="portionSelect" class="cat-select" onchange="window.updatePortionFactor()">
                <option value="1">Original Rezeptportion</option>
                <option value="2">2 Personen</option>
                <option value="4">4 Personen</option>
            </select>
        </div>
    </div>

    <div id="statusMessage" class="status-message"></div>
    <div id="weekPlan"></div>

    <button class="btn-action" onclick="window.generateShoppingList()">🛒 Einkaufsliste öffnen</button>
    <button class="btn-action ghost" onclick="window.openSyncModal()">👥 Haushalt teilen</button>
    <button class="btn-action" onclick="window.openCustomEditor()">📝 Eigenes Rezept erstellen</button>
    <button class="btn-action ghost" onclick="window.resetPlan()">✨ Plan zurücksetzen</button>
</div>

<!-- Modals -->
<div id="shoppingModal" class="modal">
    <div class="modal-content">
        <span onclick="window.closeModal('shoppingModal')" class="modal-close">×</span>
        <h2 style="text-align: center;">Einkaufsliste</h2>
        <div style="text-align:center; margin-bottom:15px;">
            <button class="btn-action small" style="background:#25D366; color:white;" onclick="window.shareWhatsApp()">📱 WhatsApp</button>
        </div>
        <div id="listContent"></div>
    </div>
</div>

<div id="recipeModal" class="modal">
    <div class="modal-content">
        <span onclick="window.closeRecipe()" class="modal-close">×</span>
        <h2 id="modalTitle">Rezept</h2>
        <div class="tab-nav">
            <button id="tabBtnDE" class="tab-btn active" onclick="window.showTab('DE')">
                <svg viewBox="0 0 36 24" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="24" fill="#000"/><rect y="8" width="36" height="8" fill="#D00"/><rect y="16" width="36" height="8" fill="#FFCE00"/></svg>
                Deutsch
            </button>
            <button id="tabBtnEN" class="tab-btn" onclick="window.showTab('EN')">
                <svg viewBox="0 0 36 24" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="24" fill="#012169"/><path d="M0 0l36 24M36 0L0 24" stroke="#fff" stroke-width="4"/><path d="M0 0l36 24M36 0L0 24" stroke="#C8102E" stroke-width="2" transform="scale(0.9) translate(1.8,1.2)"/><path d="M13 0v24M23 0v24M0 7h36M0 17h36" stroke="#fff" stroke-width="4"/><path d="M13 0v24M23 0v24M0 7h36M0 17h36" stroke="#C8102E" stroke-width="2" transform="scale(0.9) translate(1.8,1.2)"/></svg>
                English
            </button>
            <button id="tabBtnVideo" class="tab-btn" onclick="window.showTab('Video')">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="4" fill="#FF0000"/><path d="M9.5 8.5L15.5 12L9.5 15.5V8.5Z" fill="#fff"/></svg>
                YouTube
            </button>
        </div>
        <div id="contentDE" class="tab-content active">
            <div id="ingDE" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;"></div>
            <div id="insDE" style="white-space: pre-line;"></div>
        </div>
        <div id="contentEN" class="tab-content">
            <div id="ingEN" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;"></div>
            <div id="insEN" style="white-space: pre-line;"></div>
        </div>
        <div id="contentVideo" class="tab-content">
            <div id="videoBox" style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:15px; background:#000;"></div>
            <div id="videoFallback" style="margin-top:12px; text-align:center; color:var(--text);"></div>
        </div>
    </div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <span onclick="window.closeModal('customModal')" class="modal-close">×</span>
        <h2>Neues Rezept</h2>
        <input type="text" id="customName" style="width:100%; padding:10px; margin-bottom:10px; border-radius:10px; border:1px solid var(--border);" placeholder="Rezeptname">
        <textarea id="customIng" rows="4" style="width:100%; padding:10px; margin-bottom:10px; border-radius:10px; border:1px solid var(--border);" placeholder="Zutaten (eine pro Zeile)"></textarea>
        <textarea id="customIns" rows="4" style="width:100%; padding:10px; margin-bottom:10px; border-radius:10px; border:1px solid var(--border);" placeholder="Zubereitung"></textarea>
        <p style="font-size:0.8rem; font-weight:bold; margin-bottom:5px;">Foto hinzufügen:</p>
        <input type="file" id="customImgInput" accept="image/*" style="margin-bottom:15px; width:100%;">
        <button class="btn-action" onclick="window.saveCustomRecipe()">💾 Speichern</button>
    </div>
</div>

<div id="syncModal" class="modal">
    <div class="modal-content">
        <span onclick="window.closeModal('syncModal')" class="modal-close">×</span>
        <h2>Gemeinsam planen</h2>
        <p>Gib eine Haushalts-ID ein (z.B. dein Name), um den Plan zu teilen.</p>
        <input type="text" id="householdIdInput" style="width:100%; padding:10px; margin-bottom:10px; border-radius:10px; border:1px solid var(--border);" placeholder="Haushalts-ID">
        <button class="btn-action" onclick="window.joinHousehold()">🆔 Verbinden</button>
        <p id="householdInfo" style="text-align:center; font-size:0.8rem; margin-top:10px;"></p>
        <button class="btn-action ghost" onclick="window.leaveHousehold()">Verbindung trennen</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCHB9cUJ2LcQgtKoD9iUp1JtRgGzsFFLYQ",
        authDomain: "mampfi.firebaseapp.com",
        projectId: "mampfi",
        storageBucket: "mampfi.firebasestorage.app",
        messagingSenderId: "972491371290",
        appId: "1:972491371290:web:717f31db1ad003a8e432a3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tage = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
    const STORAGE_PLAN = 'gourmet_v43';
    const STORAGE_RECIPES = 'my_recipes';
    const STORAGE_THEME = 'theme';
    const STORAGE_PORTION = 'portionFactor';
    const STORAGE_HOUSEHOLD = 'household_id';

    let mealStore = {};
    let myRecipes = JSON.parse(localStorage.getItem(STORAGE_RECIPES) || '[]');
    let translationCache = JSON.parse(localStorage.getItem('translation_cache') || '{}');
    let portionFactor = Number(localStorage.getItem(STORAGE_PORTION) || '1');
    let householdId = localStorage.getItem(STORAGE_HOUSEHOLD) || null;
    let isRemoteUpdate = false;

    const PLACEHOLDER_IMG = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
            <rect width="100" height="100" fill="#e2e8f0" />
            <text x="50" y="55" text-anchor="middle" font-size="30" fill="#94a3b8">🎲</text>
        </svg>`);

    async function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = 400, h = (img.height / img.width) * 400;
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    window.scaleIngredient = function(line) {
        if (portionFactor === 1) return line;
        const numberMatch = line.match(/^(\d+([\.,]\d+)?|\d+\s+\d+\/\d+|\d+\/\d+)(?=\s|$)/);
        if (!numberMatch) return line;
        const raw = numberMatch[0].replace(',', '.');
        let amount = 0;
        if (raw.includes(' ') || raw.includes('/')) {
            const parts = raw.split(/\s+/);
            parts.forEach(p => {
                if (p.includes('/')) {
                    const [n, d] = p.split('/');
                    amount += (Number(n) / Number(d));
                } else { amount += Number(p); }
            });
        } else { amount = Number(raw); }
        let scaled = amount * portionFactor;
        let formatted = Number.isInteger(scaled) ? String(scaled) : scaled.toFixed(1);
        return line.replace(numberMatch[0], formatted);
    };

    function updateThemeButton(theme) {
        const btn = document.getElementById('themeBtn');
        if (!btn) return;
        btn.textContent = theme === 'light' ? '🌙' : '☀️';
    }

    window.toggleTheme = function() {
        const current = document.body.getAttribute('data-theme') || 'light';
        const next = current === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', next);
        localStorage.setItem(STORAGE_THEME, next);
        updateThemeButton(next);
    };

    window.updatePortionFactor = function() {
        portionFactor = Number(document.getElementById('portionSelect').value);
        localStorage.setItem(STORAGE_PORTION, portionFactor);
        window.init();
    };

    async function translateText(text, lang) {
        if (!text) return '';
        const cacheKey = `${text}_${lang}`;
        if (translationCache[cacheKey]) return translationCache[cacheKey];
        try {
            const res = await fetch(`<https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${lang}&dt=t&q=${encodeURIComponent(text)}>`);
            const data = await res.json();
            const result = data[0].map(s => s[0]).join('');
            translationCache[cacheKey] = result;
            localStorage.setItem('translation_cache', JSON.stringify(translationCache));
            return result;
        } catch (e) { return text; }
    }

    function getYoutubeVideoId(url) {
        if (!url) return null;
        const match = url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]+)/);
        return match ? match[1] : null;
    }

    window.init = function() {
        const container = document.getElementById('weekPlan');
        const saved = JSON.parse(localStorage.getItem(STORAGE_PLAN) || '{}');
        const theme = localStorage.getItem(STORAGE_THEME) || 'light';
        document.body.setAttribute('data-theme', theme);
        updateThemeButton(theme);
        document.getElementById('portionSelect').value = portionFactor;
        
        container.innerHTML = '';
        tage.forEach(tag => {
            const data = saved[tag] || { title: "", img: "", cat: "", raw: null };
            if (data.raw) mealStore[tag] = data.raw;
            const imgSrc = data.img || PLACEHOLDER_IMG;
            container.innerHTML += `
                <div class="day-card">
                    <div class="card-top">
                        <span class="day-label">${tag}</span>
                        <select class="cat-select" id="cat-${tag}" onchange="window.save()">
                            <option value="" ${data.cat === '' ? 'selected' : ''}>✨ Alles</option>
                            <option value="MY" ${data.cat === 'MY' ? 'selected' : ''}>👤 Eigene</option>
                            <option value="Vegetarian" ${data.cat === 'Vegetarian' ? 'selected' : ''}>🥗 Veggie</option>
                            <option value="Pasta" ${data.cat === 'Pasta' ? 'selected' : ''}>🍝 Pasta</option>
                            <option value="Chicken" ${data.cat === 'Chicken' ? 'selected' : ''}>🍗 Huhn</option>
                            <option value="Beef" ${data.cat === 'Beef' ? 'selected' : ''}>🥩 Rind</option>
                        </select>
                    </div>
                    <div class="card-body">
                        <img id="img-${tag}" class="meal-img ${data.img ? '' : 'placeholder'}" src="${imgSrc}">
                        <div class="meal-info">
                            <input type="text" id="input-${tag}" class="meal-input" value="${data.title}" readonly>
                            <div id="btn-${tag}" class="recipe-btn" onclick="window.openRecipe('${tag}')" style="display:${data.title ? 'block' : 'none'}">📖 Rezept</div>
                        </div>
                        <button class="btn-round" onclick="window.fetchMeal('${tag}')">🎲</button>
                    </div>
                </div>`;
        });
    };

    window.save = async function() {
        const data = {};
        tage.forEach(t => {
            const input = document.getElementById(`input-${t}`);
            const img = document.getElementById(`img-${t}`);
            const cat = document.getElementById(`cat-${t}`);
            data[t] = {
                title: input ? input.value : "",
                img: (img && img.src !== PLACEHOLDER_IMG) ? img.src : "",
                cat: cat ? cat.value : "",
                raw: mealStore[t] || null
            };
        });
        try {
            localStorage.setItem(STORAGE_PLAN, JSON.stringify(data));
            if (householdId && !isRemoteUpdate) { await setDoc(doc(db, "plans", householdId), data); }
        } catch (e) { console.warn("Save failed", e); }
    };

    window.fetchMeal = async function(tag) {
        const cat = document.getElementById(`cat-${tag}`).value;
        try {
            let meal;
            if (cat === 'MY') {
                if (myRecipes.length === 0) return alert("Keine eigenen Rezepte!");
                meal = myRecipes[Math.floor(Math.random() * myRecipes.length)];
            } else {
                const res = await fetch(cat ? `<https://www.themealdb.com/api/json/v1/1/filter.php?c=${cat}>` : 'https://www.themealdb.com/api/json/v1/1/random.php');
                const data = await res.json();
                const temp = data.meals[Math.floor(Math.random() * data.meals.length)];
                const dRes = await fetch(`<https://www.themealdb.com/api/json/v1/1/lookup.php?i=${temp.idMeal}>`);
                const dData = await dRes.json();
                meal = dData.meals[0];
            }
            const title = meal.isCustom ? meal.strMeal : await translateText(meal.strMeal, 'de');
            const imgSrc = meal.isCustom ? (meal.img || PLACEHOLDER_IMG) : meal.strMealThumb;
            document.getElementById(`input-${tag}`).value = title;
            document.getElementById(`img-${tag}`).src = imgSrc;
            document.getElementById(`img-${tag}`).classList.remove('placeholder');
            document.getElementById(`btn-${tag}`).style.display = 'block';
            mealStore[tag] = meal;
            window.save();
        } catch (e) { console.error(e); }
    };

    window.openRecipe = async function(tag) {
        const meal = mealStore[tag];
        if (!meal) return;
        document.getElementById('modalTitle').innerText = meal.isCustom ? meal.strMeal : await translateText(meal.strMeal, 'de');
        document.getElementById('recipeModal').style.display = 'flex';
        let ings = [];
        if (meal.isCustom) { ings = meal.ingredients; } 
        else { for (let i = 1; i <= 20; i++) { if (meal[`strIngredient${i}`]) ings.push(`${meal[`strMeasure${i}`] || ''} ${meal[`strIngredient${i}`]}`); } }
        const scaledIngs = ings.map(i => window.scaleIngredient(i));
        document.getElementById('ingEN').innerHTML = scaledIngs.map(i => `<div>${i}</div>`).join('');
        document.getElementById('insEN').innerText = meal.strInstructions;
        const transIngs = await Promise.all(scaledIngs.map(i => translateText(i, 'de')));
        document.getElementById('ingDE').innerHTML = transIngs.map(i => `<div style="background:var(--bg);padding:8px;border-radius:8px;">${i}</div>`).join('');
        document.getElementById('insDE').innerText = meal.isCustom ? meal.strInstructions : await translateText(meal.strInstructions, 'de');
        
        const vId = getYoutubeVideoId(meal.strYoutube);
        const videoBox = document.getElementById('videoBox');
        if (vId) {
            document.getElementById('tabBtnVideo').style.display = 'flex';
            videoBox.innerHTML = `<iframe style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" src="https://www.youtube-nocookie.com/embed/${vId}" allowfullscreen></iframe>`;
            window.showTab('Video');
        } else {
            document.getElementById('tabBtnVideo').style.display = 'none';
            window.showTab('DE');
        }
    };

    window.generateShoppingList = async function() {
        document.getElementById('shoppingModal').style.display = 'flex';
        const content = document.getElementById('listContent');
        content.innerHTML = 'Lädt...';
        const results = await Promise.all(tage.map(async t => {
            const m = mealStore[t];
            const title = document.getElementById(`input-${t}`).value;
            if (!title) return '';
            let html = `<div class="shop-day-header">${t}: ${title}</div><ul class="shopping-list">`;
            if (m) {
                let ings = m.isCustom ? m.ingredients : [];
                if (!m.isCustom) { for (let i = 1; i <= 20; i++) if (m[`strIngredient${i}`]) ings.push(`${m[`strMeasure${i}`] || ''} ${m[`strIngredient${i}`]}`); }
                const trans = await Promise.all(ings.map(i => translateText(window.scaleIngredient(i), 'de')));
                html += trans.map(i => `<li onclick="this.classList.toggle('checked')"><input type="checkbox"><span>${i}</span></li>`).join('');
            } else { html += `<li>Keine Zutaten</li>`; }
            return html + `</ul>`;
        }));
        content.innerHTML = results.join('') || 'Kein Plan.';
    };

    window.shareWhatsApp = async function() {
        let text = "*Einkaufsliste*\n\n";
        for (let t of tage) {
            const title = document.getElementById(`input-${t}`).value;
            if (!title) continue;
            text += `*${t}: ${title}*\n`;
            if (mealStore[t]) {
                let ings = mealStore[t].isCustom ? mealStore[t].ingredients : [];
                if (!mealStore[t].isCustom) { for (let i = 1; i <= 20; i++) if (mealStore[t][`strIngredient${i}`]) ings.push(`${mealStore[t][`strMeasure${i}`] || ''} ${mealStore[t][`strIngredient${i}`]}`); }
                const trans = await Promise.all(ings.map(i => translateText(window.scaleIngredient(i), 'de')));
                trans.forEach(i => text += `- ${i}\n`);
            }
            text += "\n";
        }
        window.open(`<https://wa.me/?text=${encodeURIComponent(text)}>`);
    };

    window.saveCustomRecipe = async function() {
        const name = document.getElementById('customName').value;
        const ings = document.getElementById('customIng').value.split('\n').filter(i => i.trim());
        const ins = document.getElementById('customIns').value;
        const file = document.getElementById('customImgInput').files[0];
        let img = "";
        if (file) img = await compressImage(file);
        myRecipes.push({ strMeal: name, ingredients: ings, strInstructions: ins, isCustom: true, img: img });
        localStorage.setItem(STORAGE_RECIPES, JSON.stringify(myRecipes));
        window.closeModal('customModal');
        window.init();
    };

    window.joinHousehold = function() {
        const id = document.getElementById('householdIdInput').value.trim().toLowerCase();
        if (id) { localStorage.setItem(STORAGE_HOUSEHOLD, id); location.reload(); }
    };

    window.leaveHousehold = function() { localStorage.removeItem(STORAGE_HOUSEHOLD); location.reload(); };
    window.closeModal = id => document.getElementById(id).style.display = 'none';
    window.closeRecipe = () => window.closeModal('recipeModal');
    window.showTab = lang => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('content' + lang).classList.add('active');
        document.getElementById('tabBtn' + lang).classList.add('active');
    };
    window.resetPlan = () => { if(confirm("Löschen?")) { localStorage.removeItem(STORAGE_PLAN); location.reload(); }};
    window.showMessage = (t, type) => {
        const s = document.getElementById('statusMessage');
        s.innerText = t; s.className = 'status-message message-' + type;
        setTimeout(() => s.innerText = '', 4000);
    };

    if (householdId) {
        document.getElementById('syncStatus').style.display = 'block';
        onSnapshot(doc(db, "plans", householdId), (snap) => {
            if (snap.exists() && !isRemoteUpdate) {
                isRemoteUpdate = true;
                localStorage.setItem(STORAGE_PLAN, JSON.stringify(snap.data()));
                window.init();
                isRemoteUpdate = false;
            }
        });
    }

    window.init();
</script>
</body>
</html>
