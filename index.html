<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essensplan für die Woche</title>
    <!-- PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --body-bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg: #1e293b;
            --body-bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #cbd5e1;
            --border: #475569;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--body-bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 30px 16px 40px;
        }

        .app-container {
            width: 100%;
            max-width: 760px;
            padding: 24px;
            display: grid;
            gap: 18px;
        }

        .app-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            flex-wrap: wrap;
        }

        .app-title h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 2.6rem);
            line-height: 1.1;
        }

        .subtitle {
            margin: 10px 0 0;
            color: var(--text-muted);
            max-width: 480px;
            font-size: 0.98rem;
            line-height: 1.6;
        }

        .day-card {
            background: var(--card);
            border-radius: 24px;
            padding: 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .day-card:hover {
            border-color: var(--primary);
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            width: min(100%, 320px);
        }

        .status-message {
            min-height: 24px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .status-message.message-error {
            color: var(--danger);
            font-weight: 700;
        }

        .status-message.message-success {
            color: var(--success);
            font-weight: 700;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .day-label {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
        }

        .favorite-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--danger);
        }

        .cat-select,
        input.full,
        textarea,
        .btn-action,
        .btn-round,
        .recipe-btn,
        .favorite-toggle {
            font-family: inherit;
        }

        .cat-select {
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            min-width: 140px;
            transition: border-color 0.2s;
        }

        .cat-select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .card-body {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .meal-img {
            width: 110px;
            height: 110px;
            border-radius: 20px;
            object-fit: cover;
            display: block;
            border: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg);
        }

        .meal-img.placeholder {
            border: 2px dashed var(--border);
            background: var(--bg);
            filter: grayscale(0.2) contrast(0.95);
        }

        .meal-info {
            flex-grow: 1;
            min-width: 0;
        }

        .meal-input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text);
            font-weight: 700;
            font-size: 1.1rem;
            outline: none;
        }

        .btn-round {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .btn-round:hover {
            transform: translateY(-1px);
        }

        .btn-dice {
            background: var(--accent);
            color: white;
        }

        .recipe-btn {
            cursor: pointer;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 12px;
            display: none;
            width: fit-content;
        }

        .recipe-btn:hover,
        .btn-action:hover,
        .favorite-toggle:hover {
            opacity: 0.95;
        }

        .favorite-toggle {
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 10px 14px;
            background: #fff7ed;
            color: #b45309;
            transition: background 0.2s ease;
        }

        .favorite-toggle.active {
            background: #fee2e2;
            color: var(--danger);
        }

        .btn-action {
            padding: 15px;
            border-radius: 18px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            background: var(--primary);
            color: white;
            transition: all 0.2s ease;
        }

        .btn-action.small {
            width: auto;
            padding: 12px 14px;
        }

        .btn-action.ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-action:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-action.ghost:hover {
            background: var(--bg);
            color: var(--primary);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5vh;
            backdrop-filter: blur(10px);
            overflow-y: auto;
        }

        .modal-content {
            background: var(--card);
            padding: 28px;
            border-radius: 28px;
            max-width: 640px;
            width: 94%;
            min-height: 200px;
            position: relative;
            margin-bottom: 32px;
            text-align: left;
        }

        .modal-close {
            position: absolute;
            right: 20px;
            top: 20px;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text);
        }

        .sync-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 800;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        #listContent {
            text-align: left;
            display: block;
            width: 100%;
        }

        .shop-day-header {
            color: var(--accent);
            font-weight: 800;
            margin: 25px 0 5px 0;
            border-bottom: 2px solid var(--border);
            font-size: 1.1rem;
            text-align: left;
        }

        .shop-meal-name {
            font-size: 0.95rem;
            color: var(--primary);
            margin-bottom: 12px;
            font-style: italic;
            text-align: left;
        }

        .shopping-list {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            text-align: left;
        }

        .shopping-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 15px;
            cursor: pointer;
            text-align: left;
        }

        .shopping-list li.checked {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .shopping-list input[type="checkbox"] {
            transform: scale(1.3);
            accent-color: var(--accent);
            margin-top: 3px;
            flex-shrink: 0;
        }

        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 10px 15px;
            border-radius: 12px;
            border: none;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-weight: 700;
            white-space: nowrap;
        }

        .tab-btn svg {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        textarea,
        input.full {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            margin-bottom: 10px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus, input.full:focus {
            border-color: var(--primary);
            outline: none;
        }

        .message-success {
            color: #047857;
        }

        .message-error {
            color: var(--danger);
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #shoppingModal,
            #shoppingModal * {
                visibility: visible;
            }
            #shoppingModal {
                position: static;
                display: block !important;
                width: auto;
                height: auto;
                background: transparent;
            }
            .modal-content {
                box-shadow: none;
                border: none;
                width: auto;
                margin: 0;
                padding: 0;
                background: transparent;
            }
            .modal-close,
            .btn-action.small {
                display: none !important;
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 20px 12px 32px;
            }

            .card-body {
                flex-direction: column;
                align-items: stretch;
            }

            .meal-img {
                width: 100%;
                height: 170px;
            }

            .app-top {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                justify-content: flex-start;
            }
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <!-- Firebase SDK (Modular) -->
    <script type="importmap">
      { "imports": { "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js", "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js" } }
    </script>
    <meta name="theme-color" content="#10b981">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));
        }
    </script>
</head>
<body>

<div class="app-container">
        <div class="app-top">
            <div class="app-title">
                <h1>Essensplan für die Woche</h1>
                <p class="subtitle">Würfle Rezepte, speichere eigene Gerichte und erstelle deine Einkaufsliste.</p>
                <div id="syncStatus" class="sync-badge" style="display:none; width:fit-content; margin-top:8px;">☁️ Cloud Synchronisation aktiv</div>
            </div>
            <div class="header-actions">
                <button onclick="toggleTheme()" id="themeBtn" class="btn-action small">🌙</button>
                <select id="portionSelect" class="cat-select" onchange="updatePortionFactor()" title="Portionsgröße auswählen">
                    <option value="1">Originalzutatenmenge des Rezepts</option>
                    <option value="2">2 Personen</option>
                    <option value="4">4 Personen</option>
                </select>
            </div>
        </div>
        <div id="statusMessage" class="status-message"></div>

        <div id="weekPlan"></div>

        <button class="btn-action" onclick="window.generateShoppingList()">🛒 Einkaufsliste nach Tagen</button>
        <button class="btn-action ghost" onclick="window.openSyncModal()">👥 Gemeinsam nutzen / Account</button>
        <button class="btn-action" onclick="window.openCustomEditor()">📝 Eigenes Rezept erstellen</button>
        <button class="btn-action ghost" onclick="window.resetPlan()">✨ Plan zurücksetzen</button>
    </div>

<div id="shoppingModal" class="modal">
    <div class="modal-content">
        <span onclick="window.closeModal('shoppingModal')" style="float:right; cursor:pointer; font-weight:800; font-size:1.5rem;">×</span>
        <h2 style="text-align: center; margin-bottom: 20px;">Einkaufsliste</h2>
        <div style="text-align:center;margin-bottom:16px;">
            <button class="btn-action small" onclick="window.printShoppingList()">🖨️ Drucken</button>
            <button class="btn-action small" style="background:#25D366; color:white; margin-left:8px;" onclick="window.shareWhatsApp()">📱 WhatsApp</button>
        </div>
        <div id="listContent"></div>
    </div>
</div>

<div id="recipeModal" class="modal">
    <div class="modal-content">
        <span onclick="window.closeRecipe()" class="modal-close">×</span>
        <div class="modal-header">
            <h2 id="modalTitle">Rezept</h2>
            <button id="favoriteBtn" class="btn-action small favorite-toggle" onclick="window.toggleFavorite()">★ Favorit</button>
        </div>
        <div class="tab-nav">
            <button id="tabBtnDE" class="tab-btn active" onclick="window.showTab('DE')">Deutsch</button>
            <button id="tabBtnEN" class="tab-btn" onclick="window.showTab('EN')">English</button>
            <button id="tabBtnVideo" class="tab-btn" onclick="window.showTab('Video')">YouTube</button>
        </div>
        <div id="contentDE" class="tab-content active"><div id="ingDE" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:15px;"></div><div id="insDE" style="white-space: pre-line; line-height: 1.6;"></div></div>
        <div id="contentEN" class="tab-content"><div id="ingEN" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:15px;"></div><div id="insEN" style="white-space: pre-line; line-height: 1.6;"></div></div>
        <div id="contentVideo" class="tab-content">
            <div id="videoBox" style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:15px; background:#000;"></div>
            <div id="videoFallback" style="margin-top:12px; text-align:center; color:var(--text);"></div>
        </div>
    </div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <span onclick="window.closeModal('customModal')" style="float:right; cursor:pointer; font-weight:800; font-size:1.5rem;">×</span>
        <h2 style="text-align: center; color: var(--primary);">Neues Rezept</h2>
        <input type="text" id="customName" class="full" placeholder="Name">
        <textarea id="customIng" rows="5" placeholder="Zutaten (eine pro Zeile)"></textarea>
        <textarea id="customIns" rows="5" placeholder="Zubereitung..."></textarea>
        <label style="display:block; margin-bottom:8px; font-weight:700; font-size:0.9rem;">Foto (optional):</label>
        <input type="file" id="customImgInput" class="full" accept="image/*" style="margin-bottom:10px;">
        <button class="btn-action" style="background:var(--accent); color:white;" onclick="window.saveCustomRecipe()">💾 Speichern</button>
    </div>
</div>

<div id="syncModal" class="modal">
    <div class="modal-content">
        <span onclick="window.closeModal('syncModal')" style="float:right; cursor:pointer; font-weight:800; font-size:1.5rem;">×</span>
        <h2 style="text-align: center; color: var(--primary);">Gemeinsam planen</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted); text-align:center;">Gib eine Haushalts-ID ein, um den Plan mit anderen zu teilen.</p>
        <input type="text" id="householdIdInput" class="full" placeholder="z.B. familie-mustermann">
        <button class="btn-action" onclick="window.joinHousehold()">🆔 Haushalt beitreten / Erstellen</button>
        <p id="householdInfo" style="font-size: 0.8rem; margin-top: 15px; text-align: center;"></p>
        <button class="btn-action ghost" onclick="window.leaveHousehold()">Alleine nutzen (Lokal)</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCHB9cUJ2LcQgtKoD9iUp1JtRgGzsFFLYQ",
        authDomain: "mampfi.firebaseapp.com",
        projectId: "mampfi",
        storageBucket: "mampfi.firebasestorage.app",
        messagingSenderId: "972491371290",
        appId: "1:972491371290:web:717f31db1ad003a8e432a3",
        measurementId: "G-H9JBMZSEQC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function compressImage(file, maxWidth = 600, maxHeight = 600, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > maxWidth) { h *= maxWidth / w; w = maxWidth; } }
                    else { if (h > maxHeight) { w *= maxHeight / h; h = maxHeight; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            };
            reader.onerror = reject;
        });
    }

    const tage = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
    const STORAGE_PLAN = 'gourmet_v43';
    const STORAGE_RECIPES = 'my_recipes';
    const STORAGE_THEME = 'theme';
    const STORAGE_PORTION = 'portionFactor';
    const STORAGE_HOUSEHOLD = 'household_id';

    let householdId = localStorage.getItem(STORAGE_HOUSEHOLD) || null;
    let translationCache = JSON.parse(localStorage.getItem('translation_cache') || '{}');
    let portionFactor = Number(localStorage.getItem(STORAGE_PORTION) || '1');
    let mealStore = {};
    let myRecipes = JSON.parse(localStorage.getItem(STORAGE_RECIPES) || '[]');
    let isRemoteUpdate = false;

    const PLACEHOLDER_IMG = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
            <rect width="220" height="220" rx="28" fill="#e2e8f0" />
            <rect x="16" y="16" width="188" height="188" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" />
            <text x="110" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Noch frei</text>
            <text x="110" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#334155">Würfeln, um ein Rezept zu wählen</text>
            <text x="110" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f172a">?</text>
        </svg>`);

    function parseIngredientQuantity(line) {
        const numberMatch = line.match(/^(\d+([\.,]\d+)?|\d+\s+\d+\/\d+|\d+\/\d+)(?=\s|$)/);
        if (!numberMatch) return { scaled: line, hadQuantity: false };

        let rawAmount = numberMatch[0];
        let amount = 1;

        if (rawAmount.includes('/')) {
            const mixedMatch = rawAmount.match(/^(\d+)\s+(\d+)\/(\d+)$/);
            if (mixedMatch) {
                amount = Number(mixedMatch[1]) + Number(mixedMatch[2]) / Number(mixedMatch[3]);
            } else {
                const fracMatch = rawAmount.match(/^(\d+)\/(\d+)$/);
                if (fracMatch) {
                    amount = Number(fracMatch[1]) / Number(fracMatch[2]);
                }
            }
        } else {
            amount = Number(rawAmount.replace(',', '.'));
        }

        const scaled = amount * portionFactor;
        const formatted = Number.isInteger(scaled) ? String(scaled) : scaled.toFixed(2).replace(/\.00$/, '').replace(/\.(\d)0$/, '.$1');
        return { scaled: line.replace(rawAmount, formatted), hadQuantity: true };
    }

    window.scaleIngredient = function(line) {
        if (portionFactor === 1) return line;
        const result = parseIngredientQuantity(line);
        return result.hadQuantity ? result.scaled : line;
    };

    window.updatePortionFactor = function() {
        const select = document.getElementById('portionSelect');
        portionFactor = Number(select.value);
        localStorage.setItem(STORAGE_PORTION, portionFactor);
        const message = portionFactor === 1
            ? 'Originalzutatenmenge des Rezepts aktiviert.'
            : `Portionen eingestellt auf ${portionFactor} Personen.`;
        window.showMessage(message, 'info');
        window.init();
    };

    window.showMessage = function(text, type = 'info') {
        const status = document.getElementById('statusMessage');
        if (!status) return;
        status.textContent = text;
        status.className = `status-message message-${type}`;
        setTimeout(() => {
            status.textContent = '';
            status.className = 'status-message';
        }, 4000);
    };

    window.init = function(isFromCloud = false) {
        const container = document.getElementById('weekPlan');
        if (!container) return;

        let saved = {};
        try {
            saved = JSON.parse(localStorage.getItem(STORAGE_PLAN) || '{}');
        } catch (e) {
            console.error("Datenfehler im LocalStorage", e);
        }

        const theme = localStorage.getItem(STORAGE_THEME) || 'light';
        document.body.setAttribute('data-theme', theme);
        updateThemeButton(theme);
        document.getElementById('portionSelect').value = portionFactor;

        container.innerHTML = '';
        tage.forEach(tag => {
            const data = saved[tag] || { title: "", img: "", cat: "", raw: null };
            if (data.raw) mealStore[tag] = data.raw;
            
            const imgSrc = data.img || PLACEHOLDER_IMG;
            const imgClass = data.img && data.img !== PLACEHOLDER_IMG ? 'meal-img' : 'meal-img placeholder';
            const imgAlt = data.title || 'Noch nicht gewürfelt';

            container.innerHTML += `
                <div class="day-card">
                    <div class="card-top">
                        <span class="day-label">${tag}</span>
                        <select class="cat-select" id="cat-${tag}" onchange="window.save()">
                            <option value="" ${data.cat === '' ? 'selected' : ''}>✨ Alles</option>
                            <option value="MY" ${data.cat === 'MY' ? 'selected' : ''}>👤 Eigene</option>
                            <option value="Vegetarian" ${data.cat === 'Vegetarian' ? 'selected' : ''}>🥗 Veggie</option>
                            <option value="Pasta" ${data.cat === 'Pasta' ? 'selected' : ''}>🍝 Pasta</option>
                            <option value="Seafood" ${data.cat === 'Seafood' ? 'selected' : ''}>🐟 Fisch</option>
                            <option value="Chicken" ${data.cat === 'Chicken' ? 'selected' : ''}>🍗 Huhn</option>
                            <option value="Beef" ${data.cat === 'Beef' ? 'selected' : ''}>🥩 Rind</option>
                            <option value="Pork" ${data.cat === 'Pork' ? 'selected' : ''}>🍖 Schwein</option>
                            <option value="Lamb" ${data.cat === 'Lamb' ? 'selected' : ''}>🐑 Lamm</option>
                            <option value="Side" ${data.cat === 'Side' ? 'selected' : ''}>🍟 Beilagen</option>
                            <option value="Starter" ${data.cat === 'Starter' ? 'selected' : ''}>🍲 Vorspeise</option>
                            <option value="Dessert" ${data.cat === 'Dessert' ? 'selected' : ''}>🍰 Dessert</option>
                        </select>
                    </div>
                    <div class="card-body">
                        <img id="img-${tag}" class="${imgClass}" src="${imgSrc}" alt="${imgAlt}" />
                        <div class="meal-info">
                            <input type="text" id="input-${tag}" class="meal-input" value="${data.title}" readonly placeholder="Würfeln...">
                            <div id="btn-${tag}" class="recipe-btn" onclick="window.openRecipe('${tag}')" style="display:${data.title ? 'block' : 'none'}">📖 Rezept</div>
                        </div>
                        <button class="btn-round btn-dice" onclick="window.fetchMeal('${tag}')">🎲</button>
                    </div>
                </div>`;
        });
    };

    function splitLongText(text, maxLength = 450) {
        const parts = [];
        let remaining = text.trim();
        while (remaining.length > 0) {
            if (remaining.length <= maxLength) {
                parts.push(remaining);
                break;
            }
            let splitIndex = remaining.lastIndexOf('. ', maxLength);
            if (splitIndex === -1) splitIndex = remaining.lastIndexOf(' ', maxLength);
            if (splitIndex === -1) splitIndex = maxLength;
            parts.push(remaining.slice(0, splitIndex + (remaining[splitIndex] === ' ' ? 0 : 0)).trim());
            remaining = remaining.slice(splitIndex).trim();
        }
        return parts;
    }

    async function translateText(text, lang) {
        if (!text) return '';
        const cacheKey = `${text}_${lang}`;
        if (translationCache[cacheKey]) return translationCache[cacheKey];

        const parts = splitLongText(text, 450);
        const translations = [];
        for (const part of parts) {
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(part)}&langpair=en|${lang}`;
                const res = await fetch(url);
                if (!res.ok) { translations.push(await translateWithGoogle(part, lang)); continue; }
                const data = await res.json();
                const translated = data.responseData?.translatedText;
                translations.push(translated && translated !== part ? translated : await translateWithGoogle(part, lang));
            } catch (e) { translations.push(await translateWithGoogle(part, lang)); }
        }
        const result = translations.join(' ');
        translationCache[cacheKey] = result;
        localStorage.setItem('translation_cache', JSON.stringify(translationCache));
        return result;
    }

    async function translateWithGoogle(text, lang) {
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url);
            if (!res.ok) return text;
            const data = await res.json();
            return data[0].map(s => s[0]).join('') || text;
        } catch (e) { return text; }
    }

    function getYoutubeVideoId(url) {
        if (!url) return null;
        try {
            const parsed = new URL(url);
            if (parsed.hostname.includes('youtu.be')) return parsed.pathname.slice(1);
            if (parsed.hostname.includes('youtube.com')) {
                if (parsed.searchParams.has('v')) return parsed.searchParams.get('v');
                const pathMatch = parsed.pathname.match(/embed\/([a-zA-Z0-9_-]+)/);
                if (pathMatch) return pathMatch[1];
            }
        } catch (e) {
            const match = url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }
        return null;
    }

    function updateThemeButton(theme) {
        const btn = document.getElementById('themeBtn');
        if (!btn) return;
        btn.textContent = theme === 'light' ? '🌙' : '☀️';
        btn.title = theme === 'light' ? 'Dunkles Theme' : 'Helles Theme';
    }

    window.openCustomEditor = function() {
        document.getElementById('customModal').style.display = 'flex';
    };

    window.saveCustomRecipe = async function() {
        const name = document.getElementById('customName').value.trim();
        const ingRaw = document.getElementById('customIng').value.split('\n').map(i => i.trim()).filter(Boolean);
        const ins = document.getElementById('customIns').value.trim();
        const imgInput = document.getElementById('customImgInput');

        if (!name || ingRaw.length === 0) return alert('Bitte Name und Zutaten angeben!');

        let imgBase64 = null;
        if (imgInput.files && imgInput.files[0]) {
            try {
                imgBase64 = await compressImage(imgInput.files[0]);
            } catch (e) { console.error("Bild-Kompression fehlgeschlagen", e); }
        }

        myRecipes.push({ strMeal: name, strInstructions: ins, isCustom: true, ingredients: ingRaw, img: imgBase64 });
        localStorage.setItem(STORAGE_RECIPES, JSON.stringify(myRecipes));
        document.getElementById('customName').value = '';
        document.getElementById('customIng').value = '';
        document.getElementById('customIns').value = '';
        if(imgInput) imgInput.value = '';
        window.closeModal('customModal');
    };

    window.fetchMeal = async function(tag) {
        const catSelect = document.getElementById(`cat-${tag}`);
        const category = catSelect ? catSelect.value : "";
        let meal;
        try {
            if (category === 'MY') {
                if (myRecipes.length === 0) return alert('Keine eigenen Rezepte vorhanden.');
                meal = myRecipes[Math.floor(Math.random() * myRecipes.length)];
            } else {
                const apiURL = category ? `https://www.themealdb.com/api/json/v1/1/filter.php?c=${category}` : 'https://www.themealdb.com/api/json/v1/1/random.php';
                const res = await fetch(apiURL);
                if (!res.ok) throw new Error('API-Anfrage fehlgeschlagen');
                const data = await res.json();
                if (!data.meals?.length) return alert('Für diese Kategorie wurde kein Rezept gefunden.');
                const tempMeal = data.meals[Math.floor(Math.random() * data.meals.length)];
                const dRes = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${tempMeal.idMeal}`);
                if (!dRes.ok) throw new Error('Detaildaten konnten nicht geladen werden');
                const dData = await dRes.json();
                meal = dData.meals?.[0];
                if (!meal) throw new Error('Das Rezept konnte nicht geladen werden.');
            }

            const nameDE = meal.isCustom ? meal.strMeal : await translateText(meal.strMeal, 'de');
            const imgSrc = meal.isCustom ? (meal.img || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=200') : meal.strMealThumb;
            document.getElementById(`input-${tag}`).value = nameDE;
            document.getElementById(`img-${tag}`).src = imgSrc;
            document.getElementById(`img-${tag}`).style.display = 'block';
            document.getElementById(`btn-${tag}`).style.display = 'block';
            mealStore[tag] = meal;
            window.save();
        } catch (error) {
            console.error(error);
            alert('Fehler beim Laden des Rezepts. Bitte versuche es erneut.');
        }
    };

    window.openRecipe = async function(tag) {
        const meal = mealStore[tag];
        if (!meal) return;
        const title = meal.isCustom ? meal.strMeal : await translateText(meal.strMeal, 'de');
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('recipeModal').style.display = 'flex';
        const tabBtnEN = document.getElementById('tabBtnEN');
        const tabBtnVideo = document.getElementById('tabBtnVideo');
        let ingsEN = [];
        if (meal.isCustom) {
            ingsEN = meal.ingredients; tabBtnEN.style.display = 'none'; tabBtnVideo.style.display = 'none';
        } else {
            tabBtnEN.style.display = 'block';
            for (let i = 1; i <= 20; i++) {
                const ingredient = meal[`strIngredient${i}`];
                if (ingredient) ingsEN.push(`${meal[`strMeasure${i}`] || ''} ${ingredient}`.trim());
            }
        }
        const displayedIngredients = ingsEN.map(line => window.scaleIngredient(line));
        document.getElementById('ingEN').innerHTML = displayedIngredients.map(i => `<div>${i}</div>`).join('');
        document.getElementById('insEN').innerText = meal.strInstructions || '';
        const translatedIngredients = meal.isCustom
            ? displayedIngredients : await Promise.all(displayedIngredients.map(i => translateText(i, 'de')));
        document.getElementById('ingDE').innerHTML = translatedIngredients.map(i => `<div style="background:var(--bg);padding:8px;border-radius:10px;">${i}</div>`).join('');
        document.getElementById('insDE').innerText = meal.isCustom ? meal.strInstructions : await translateText(meal.strInstructions, 'de');
        const vId = !meal.isCustom && meal.strYoutube ? getYoutubeVideoId(meal.strYoutube) : null;
        const videoBox = document.getElementById('videoBox'); const videoFallback = document.getElementById('videoFallback');
        if (vId) {
            tabBtnVideo.style.display = 'block';
            const youtubeUrl = `https://www.youtube.com/watch?v=${vId}`; const embedUrl = `https://www.youtube-nocookie.com/embed/${vId}?rel=0&modestbranding=1&showinfo=0`;
            videoBox.innerHTML = `<iframe style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" src="${embedUrl}" allowfullscreen></iframe>`;
            videoFallback.innerHTML = `<a href="${youtubeUrl}" target="_blank" style="color:var(--accent);">▶️ Auf YouTube ansehen</a>`;
        } else { tabBtnVideo.style.display = 'none'; videoBox.innerHTML = ''; videoFallback.innerHTML = ''; }
        window.showTab('DE');
    };

    window.generateShoppingList = async function() {
        const content = document.getElementById('listContent');
        content.innerHTML = '⏳ Liste wird erstellt...';
        document.getElementById('shoppingModal').style.display = 'flex';
        let html = '';
        for (let tag of tage) {
            const m = mealStore[tag];
            const titleInput = document.getElementById(`input-${tag}`);
            const title = titleInput ? titleInput.value.trim() : "";
            if (!title) continue;

            const ingredients = [];
            if (m) {
                if (m.isCustom) {
                    ingredients.push(...m.ingredients.map(line => window.scaleIngredient(line)));
                } else {
                    for (let i = 1; i <= 20; i++) {
                        const ingredient = m[`strIngredient${i}`]?.trim();
                        const measure = m[`strMeasure${i}`]?.trim() || '';
                        if (ingredient) ingredients.push(window.scaleIngredient(`${measure} ${ingredient}`.trim()));
                    }
                }
            }
            
            const [mealTitle, ...translatedItems] = await Promise.all([
                (m && !m.isCustom) ? translateText(title, 'de') : Promise.resolve(title), 
                ...ingredients.map(i => (m && !m.isCustom) ? translateText(i, 'de') : Promise.resolve(i))
            ]);

            html += `<div class="shop-day-header">${tag}</div><div class="shop-meal-name">${mealTitle}</div><ul class="shopping-list">`;
            if (translatedItems.length > 0) {
                html += translatedItems.filter(Boolean).map(i => `<li onclick="this.classList.toggle('checked')"><input type="checkbox"><span>${i}</span></li>`).join('');
            } else {
                html += `<li style="list-style:none; color:var(--text-muted); font-size:0.85rem;">Keine Zutaten verfügbar</li>`;
            }
            html += `</ul>`;
        }
        content.innerHTML = html || 'Kein Plan vorhanden.';
    };
            
    window.shareWhatsApp = async function() {
        let text = "*Einkaufsliste* 🛒\n\n";
        let hasContent = false;
        for (let tag of tage) {
            const m = mealStore[tag];
            const titleInput = document.getElementById(`input-${tag}`);
            const title = titleInput ? titleInput.value.trim() : "";
            if (!title) continue;
            hasContent = true;
            
            const ingredients = [];
            if (m) {
                if (m.isCustom) {
                    ingredients.push(...m.ingredients.map(line => window.scaleIngredient(line)));
                } else {
                    for (let i = 1; i <= 20; i++) {
                        const ingredient = m[`strIngredient${i}`]?.trim();
                        const measure = m[`strMeasure${i}`]?.trim() || '';
                        if (ingredient) ingredients.push(window.scaleIngredient(`${measure} ${ingredient}`.trim()));
                    }
                }
            }

            const [mealTitle, ...translatedItems] = await Promise.all([
                (m && !m.isCustom) ? translateText(title, 'de') : Promise.resolve(title), 
                ...ingredients.map(i => (m && !m.isCustom) ? translateText(i, 'de') : Promise.resolve(i))
            ]);

            text += `*${tag}: ${mealTitle}*\n`;
            translatedItems.filter(Boolean).forEach(i => text += `- ${i}\n`);
            text += "\n";
        }
        if (!hasContent) return alert("Kein Plan vorhanden zum Teilen.");
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    };

    window.showTab = function(lang) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const content = document.getElementById('content' + lang); if (content) content.classList.add('active');
        const btn = document.getElementById('tabBtn' + lang); if (btn) btn.classList.add('active');
    };

    window.closeModal = function(id) {
        const modal = document.getElementById(id); if (modal) modal.style.display = 'none';
    };

    window.closeRecipe = function() {
        window.closeModal('recipeModal'); const vb = document.getElementById('videoBox'); if (vb) vb.innerHTML = '';
    };

    window.toggleFavorite = function() { window.showMessage("Favoriten kommen bald!", "info"); };

    window.resetPlan = async function() {
        if (confirm('Plan zurücksetzen?')) {
            localStorage.removeItem(STORAGE_PLAN); mealStore = {}; window.init(); window.showMessage('Plan wurde zurückgesetzt.', 'info');
        }
    };

    window.openSyncModal = function() {
        const input = document.getElementById('householdIdInput'); if (input) input.value = householdId || '';
        const info = document.getElementById('householdInfo'); if (info) info.textContent = householdId ? `Aktueller Haushalt: ${householdId}` : 'Noch kein Haushalt verknüpft.';
        const modal = document.getElementById('syncModal'); if (modal) modal.style.display = 'flex';
    };

    window.joinHousehold = async function() {
        const input = document.getElementById('householdIdInput');
        const id = input ? input.value.trim().toLowerCase().replace(/[^a-z0-1-]/g, '') : "";
        if (id.length < 3) return alert("ID zu kurz!");
        localStorage.setItem(STORAGE_HOUSEHOLD, id); window.showMessage("Haushalt beigetreten. Lade Daten...", "success"); location.reload();
    };

    window.leaveHousehold = function() {
        localStorage.removeItem(STORAGE_HOUSEHOLD);
        location.reload();
    };

    if (householdId) {
        const status = document.getElementById('syncStatus'); if (status) status.style.display = 'block';
        const planRef = doc(db, "plans", householdId);
        onSnapshot(planRef, (docSnap) => {
            if (docSnap.exists()) {
                const remoteData = docSnap.data();
                const localData = JSON.parse(localStorage.getItem(STORAGE_PLAN) || '{}');
                if (JSON.stringify(remoteData) !== JSON.stringify(localData)) {
                    isRemoteUpdate = true; localStorage.setItem(STORAGE_PLAN, JSON.stringify(remoteData)); window.init(true); isRemoteUpdate = false;
                }
            }
        });
    }

    window.addEventListener('click', event => {
        const modal = event.target.closest('.modal'); if (modal && event.target === modal) window.closeModal(modal.id);
    });

    window.init();
</script>
